name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge test -vv

  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos/AgentOre
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

